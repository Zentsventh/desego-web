name: Build cPanel production assets

on:
  push:
    branches:
      - main
    paths-ignore:
      - public/build/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-production-assets
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Commit compiled assets for cPanel polling deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          if git diff --cached --quiet; then
            echo "Production assets are already current."
            exit 0
          fi
          git commit -m "Build production assets [skip ci]"
          git push origin HEAD:main
